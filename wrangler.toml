# ==============================================================================
# RADAR MINERO — CONFIGURACIÓN DE CLOUDFLARE (PAGES & D1)
# ==============================================================================

name = "radar-minero"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# Vinculación de Base de Datos Cloudflare D1
[[d1_databases]]
binding = "DB"
database_name = "radar-minero-db"
database_id = "radar-minero-d1-id" # Se actualiza tras crear la base de datos en Cloudflare

# Configuración de Cron Triggers Semanales (Lunes 06:00 AM UTC)
[triggers]
crons = ["0 6 * * 1"]
