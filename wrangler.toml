# ==============================================================================
# TRACER — CONFIGURACIÓN DE CLOUDFLARE WORKER & STATIC ASSETS
# InteligenciaConectada™ · B2B Industrial Intelligence Platform
# ==============================================================================

name = "radar-minero"
main = "worker.js"
compatibility_date = "2024-11-01"

# Rutas de producción: ambos dominios apuntan al mismo Worker
routes = [
  { pattern = "radar.inteligenciaconectada.com/*", zone_name = "inteligenciaconectada.com" },
  { pattern = "tracer.inteligenciaconectada.com/*", zone_name = "inteligenciaconectada.com" }
]

# La URL pública *.workers.dev queda desactivada: el acceso es solo por el dominio protegido por Access.
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Asistente de IA (Workers AI, sin clave). Si se define el secreto ANTHROPIC_API_KEY, se usa Claude en su lugar.
[ai]
binding = "AI"

# Vinculación de Base de Datos Cloudflare D1
[[d1_databases]]
binding = "DB"
database_name = "radar-minero-db"
database_id = "9c04a732-a945-4706-b392-b19843cd3148"

# Cloudflare Access (Zero Trust). REQUIRE_AUTH = "1": toda /api/* exige sesión válida de Access (excepto /api/health).
# Verificado el 2026-11-04. Para reabrir la API temporalmente, poner "0" y volver a publicar.
[vars]
ACCESS_TEAM_DOMAIN = "weathered-pine-5574.cloudflareaccess.com"
ACCESS_AUD = "84b91b2630484e86910ac6e516ac1635848a2c9d0328de1e5777896ce7777c6f"
REQUIRE_AUTH = "1"
